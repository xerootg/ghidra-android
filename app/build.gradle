plugins {
    id 'com.android.application'
}

def ghidraVersion = providers.gradleProperty('ghidraVersion').getOrElse('12.1.4')

android {
    namespace 'io.github.xerootg.ghidroid'
    compileSdk 36
    ndkVersion '29.0.14206865'

    defaultConfig {
        applicationId 'io.github.xerootg.ghidroid'
        minSdk 31
        targetSdk 35
        versionCode 3
        versionName '0.3.0'
        buildConfigField 'String', 'GHIDRA_VERSION', "\"${ghidraVersion}\""
        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=none'
            }
        }
    }

    signingConfigs {
        release {
            def ks = System.getenv('GHIDROID_KEYSTORE')
            if (ks != null) {
                storeFile file(ks)
                storePassword System.getenv('GHIDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('GHIDROID_KEY_ALIAS') ?: 'ghidroid'
                keyPassword System.getenv('GHIDROID_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig System.getenv('GHIDROID_KEYSTORE') != null ? signingConfigs.release : signingConfigs.debug
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
        }
    }

    packaging {
        jniLibs {
            // decompile/sleigh are executables packaged as lib*.so; they must
            // be extracted to the native library dir to be exec()-able.
            useLegacyPackaging true
        }
    }

    androidResources {
        // The JRE and toolkit are zips/jars already.
        noCompress += ['zip', 'jar']
    }
}
